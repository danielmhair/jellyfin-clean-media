name: Release plugin

# Auto-release the Jellyfin plugin whenever its source changes on main.
#
# You just push to main (directly, or by merging a PR). This bumps the version
# (patch of the 3rd segment), builds the plugin, writes the release zip into
# plugin/releases/, updates manifest.json, and commits it all back — so Jellyfin
# (which installs from the raw manifest URL) sees the new version with no manual
# step.
#
# The changelog for the release is the **merged PR's description** (what you
# already wrote in the PR body); for a direct push with no PR it falls back to
# the commit message.
on:
  push:
    branches: [main]
    paths:
      - 'plugin/Jellyfin.Plugin.CleanMedia/**'

permissions:
  contents: write   # commit the release back

# Serialize releases so two quick pushes can't both bump to the same version.
concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Don't loop on the workflow's own release commit. (GITHUB_TOKEN pushes don't
    # retrigger workflows anyway — this is belt-and-suspenders.)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # be on the branch (not detached) so we can push
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Compute next version
        id: ver
        run: |
          proj=plugin/Jellyfin.Plugin.CleanMedia/Jellyfin.Plugin.CleanMedia.csproj
          cur=$(sed -n 's#.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*#\1#p' "$proj")
          IFS=. read -r a b c d <<< "$cur"
          next="${a}.${b}.$((c + 1)).0"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $cur -> $next"

      - name: Resolve changelog (PR description, else commit message)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # The changelog is the merged PR's body; for a direct push (no PR),
          # fall back to the commit message. HTML comments (PR-template
          # boilerplate) are stripped.
          body=$(gh pr list --state merged --search "$HEAD_SHA" \
                   --json body --jq '.[0].body // ""' 2>/dev/null || true)
          if [ -z "$body" ]; then body=$(git log -1 --format=%B); fi
          cl=$(printf '%s' "$body" | python3 -c \
            'import sys,re; t=re.sub(r"<!--.*?-->","",sys.stdin.read(),flags=re.S).strip(); print(t or "See the repository for changes.")')
          echo "changelog:"; echo "$cl"
          { echo "CHANGELOG<<CL_EOF"; printf '%s\n' "$cl"; echo "CL_EOF"; } >> "$GITHUB_ENV"

      - name: Build plugin & update manifest
        run: scripts/release-plugin.sh "${{ steps.ver.outputs.next }}"   # uses $CHANGELOG

      - name: Commit & push the release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json plugin/releases \
            plugin/Jellyfin.Plugin.CleanMedia/Jellyfin.Plugin.CleanMedia.csproj
          git commit -m "Release plugin ${{ steps.ver.outputs.next }} [skip ci]"
          git push origin "${{ github.ref_name }}"
