name: Release

# Auto-release Clean Media whenever the worker OR the plugin source changes on
# main (a merged PR or a direct push). The worker and plugin ship as a matched
# pair: one version, one git tag (vX.Y.Z), the plugin published as X.Y.Z.0 and
# the worker stamped X.Y.Z. CI does the mechanical part — bump the version, build
# the plugin, write the release zip + manifest.json, stamp the worker version,
# commit it back, and cut a GitHub Release in the repo (tag + notes + the zip).
#
# The one human/authored part is the changelog: Claude Code writes it into
# plugin/CHANGELOG_NEXT.md as part of the change, and CI uses that as both the
# manifest changelog and the GitHub Release notes (falling back to the commit
# message if the file is empty).
on:
  push:
    branches: [main]
    paths:
      - 'plugin/Jellyfin.Plugin.CleanMedia/**'
      - 'worker/**'
  # Manual re-run: a release that failed on a bug outside the trigger paths
  # (e.g. the release script itself) can be retried without a source change.
  workflow_dispatch: {}

permissions:
  contents: write   # commit the release back + create the GitHub Release

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Don't loop on the workflow's own release commit. (GITHUB_TOKEN pushes don't
    # retrigger workflows anyway — this is belt-and-suspenders.)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      # The 4-segment plugin version, e.g. "0.2.17.0" — this is what the tag
      # actually is ("v$VERSION" below uses this same next, not next3), so the
      # dmg job must check out v<this>, not the 3-segment worker version.
      version: ${{ steps.ver.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # be on the branch (not detached) so we can push
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Compute next version
        id: ver
        run: |
          proj=plugin/Jellyfin.Plugin.CleanMedia/Jellyfin.Plugin.CleanMedia.csproj
          cur=$(sed -n 's#.*<AssemblyVersion>\([^<]*\)</AssemblyVersion>.*#\1#p' "$proj")
          IFS=. read -r a b c d <<< "$cur"
          next="${a}.${b}.$((c + 1)).0"          # plugin (4-segment)
          next3="${a}.${b}.$((c + 1))"           # worker/project (3-segment)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "next3=$next3" >> "$GITHUB_OUTPUT"
          echo "Releasing $cur -> $next"

      - name: Stamp the worker version (lockstep with the plugin)
        run: |
          init=worker/__init__.py
          sed -i "s#^__version__ = \".*\"#__version__ = \"${{ steps.ver.outputs.next3 }}\"#" "$init"
          grep '^__version__' "$init"

      - name: Resolve changelog (the file Claude wrote, else the commit message)
        id: cl
        run: |
          file=plugin/CHANGELOG_NEXT.md
          body=""
          if [ -f "$file" ]; then
            body=$(python3 -c 'import re,sys; print(re.sub(r"<!--.*?-->","",open("'"$file"'",encoding="utf-8").read(),flags=re.S).strip())')
          fi
          if [ -n "$body" ]; then
            echo "used_file=true" >> "$GITHUB_OUTPUT"
            cl="$body"
          else
            cl=$(git log -1 --format=%B)
          fi
          echo "changelog:"; echo "$cl"
          { echo "CHANGELOG<<CL_EOF"; printf '%s\n' "$cl"; echo "CL_EOF"; } >> "$GITHUB_ENV"

      - name: Build plugin & update manifest
        # Invoke via bash, not directly: the script is authored on Windows where
        # the executable bit isn't tracked, so `./script` exits 126 on Linux CI.
        run: bash scripts/release-plugin.sh "${{ steps.ver.outputs.next }}"   # uses $CHANGELOG

      - name: Reset the changelog file for the next release
        if: steps.cl.outputs.used_file == 'true'
        run: |
          printf '%s\n' '<!-- Next plugin release changelog. Claude Code writes the user-facing notes here with each plugin change; the release workflow uses it as the changelog, then resets this file. Empty => the release falls back to the commit message. -->' > plugin/CHANGELOG_NEXT.md

      - name: Update the browsable CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.next }}
        run: python3 scripts/prepend_changelog.py "$VERSION" "$(date -u +%F)"

      - name: Commit, push, and cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json CHANGELOG.md plugin/releases plugin/CHANGELOG_NEXT.md \
            plugin/Jellyfin.Plugin.CleanMedia/Jellyfin.Plugin.CleanMedia.csproj \
            worker/__init__.py
          git commit -m "Release plugin $VERSION [skip ci]"
          git push origin "${{ github.ref_name }}"
          # A real GitHub Release in the repo: tag, the authored notes, and the zip.
          printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            --title "Clean Media $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$(git rev-parse HEAD)" \
            "plugin/releases/clean-media-$VERSION.zip"

  dmg:
    # scripts/build-dmg.sh needs hdiutil, so this can't run alongside the
    # plugin build on ubuntu-latest — a separate macOS job, attaching the
    # .dmg to the release the job above already cut. If this job fails, the
    # release still exists (with the plugin zip); re-run this job alone from
    # the Actions tab, or run scripts/build-dmg.sh locally on a Mac and
    # `gh release upload` it by hand.
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Build the DMG
        run: bash scripts/build-dmg.sh

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.release.outputs.version }}" dist/CleanMedia.dmg --clobber

  pkg:
    # A separate job from `dmg`, not extra steps in it: build-pkg.sh is new
    # and untested on real hardware (see its header comment), so a bug in it
    # must never take down the already-working .dmg upload. Each artifact's
    # job fails on its own; the other one, and the release itself, are fine.
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Build the PKG
        run: bash scripts/build-pkg.sh

      - name: Install it for real and verify the worker actually comes up
        # There's no spare Mac to hand this to, so this is the next best
        # thing: the runner IS a real macOS machine with a real console
        # session and passwordless sudo, so `installer` runs the actual
        # scripts/pkg/postinstall exactly as it would on a friend's Mac --
        # console-user detection, dropping root, running install.sh
        # unattended, registering the launchd service. Verify the invariant,
        # not the exit code: `installer` can report success on a postinstall
        # that quietly did nothing useful, so check the concrete things that
        # actually matter instead of trusting its exit code alone.
        #
        # What this does NOT cover: the runner ships Homebrew pre-installed,
        # so postinstall's "create a fresh prefix, chown it to the console
        # user" branch -- the one that avoids a second password prompt on a
        # genuinely bare Mac -- never fires here. That path stays unverified
        # until this runs on an actual clean machine.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo installer -pkg dist/CleanMedia.pkg -target /

          owner="$(stat -f '%Su' '/Library/Application Support/CleanMedia')"
          [ "$owner" = "$(whoami)" ] || {
            echo "install dir is owned by $owner, not $(whoami) -- the postinstall privilege drop failed"
            exit 1
          }

          grep -q "You're set up" "/Library/Application Support/CleanMedia/install.log" || {
            echo "install.log never reached the finish line:"
            cat "/Library/Application Support/CleanMedia/install.log"
            exit 1
          }

          # The tail-window script (opened automatically during install) watches
          # for this exact file to know when to auto-close itself or show the
          # "send this to the developer" failure message -- confirm postinstall
          # actually writes it, and with the right content, not just that the
          # install happened to succeed by some other measure.
          status_content="$(cat '/Library/Application Support/CleanMedia/.install-status' 2>/dev/null || true)"
          [ "$status_content" = "0" ] || {
            echo ".install-status is '$status_content', expected '0'"
            exit 1
          }

          test -f "$HOME/Library/LaunchAgents/com.cleanmedia.worker.plist" || {
            echo "the launchd service was never registered"
            exit 1
          }

          ok=0
          for _ in $(seq 1 10); do
            if curl -fsS --max-time 5 http://127.0.0.1:8765/api/health \
                | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('status')=='ok' else 1)"; then
              ok=1; break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "the worker never answered on :8765 after install"; exit 1; }

          # The Desktop icon is how a friend manages the worker from here on
          # (status/restart/settings) -- confirm install.sh actually created
          # it, and that it runs cleanly (menu choice 4 = quit immediately).
          icon="$HOME/Desktop/Clean Media Worker.command"
          test -x "$icon" || { echo "the Desktop icon was never created"; exit 1; }
          printf '4\n' | bash "$icon" >/tmp/icon-smoke.log 2>&1
          grep -q "Clean Media Worker" /tmp/icon-smoke.log || {
            echo "the Desktop icon did not produce its status menu:"
            cat /tmp/icon-smoke.log
            exit 1
          }

          echo "verified: postinstall dropped to the console user, install.sh finished, the launchd service is registered, the worker answers on :8765, and the Desktop icon works."

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.release.outputs.version }}" dist/CleanMedia.pkg --clobber
