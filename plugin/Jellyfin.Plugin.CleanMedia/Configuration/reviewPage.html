<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Clean Media Review</title>
</head>
<body>
<div id="CleanMediaReviewPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary">

            <!-- Libraries -->
            <div id="CmLibraryView">
                <h2 style="margin-bottom:.2em;">Clean Media Review</h2>
                <p class="fieldDescription" style="margin-top:0;">
                    Nothing is skipped during playback until it is approved here.
                </p>
                <!-- Jellyfin's plugin "Settings" button always opens the
                     main-menu page (this one), never the config page, so give
                     the settings a reachable link from here. -->
                <button is="emby-button" type="button" id="CmOpenSettings"
                        class="raised emby-button" style="margin-bottom:1em;">
                    <span>&#9881; Worker settings</span>
                </button>
                <div id="CmLibraryPicker"></div>
            </div>

            <!-- One library's videos -->
            <div id="CmItemsView" style="display:none;">
                <button is="emby-button" type="button" class="raised emby-button cmBack">
                    <span>&larr; All libraries</span>
                </button>
                <h2 id="CmLibraryName" style="display:inline-block;margin:0 0 0 1em;"></h2>

                <div style="margin:1em 0;display:flex;gap:.6em;flex-wrap:wrap;align-items:center;">
                    <select is="emby-select" id="CmFilter" style="max-width:220px;">
                        <option value="all">All videos</option>
                        <option value="pending">Needs review</option>
                        <option value="unanalyzed">Not analyzed</option>
                        <option value="done">Fully reviewed</option>
                    </select>
                    <select is="emby-select" id="CmEngine" style="max-width:220px;">
                        <option value="subtitles">Profanity (subtitles) — fast</option>
                        <option value="whisper">Profanity (whisper) — slower</option>
                        <option value="vlm">Visual scenes (VLM) — hours</option>
                    </select>
                    <button is="emby-button" type="button" id="CmQueueVisible"
                            class="raised emby-button"><span>Queue shown videos</span></button>
                    <button is="emby-button" type="button" id="CmCancelAll"
                            class="raised emby-button" style="display:none;"><span>Cancel all analysis</span></button>
                    <span id="CmQueueResult" class="fieldDescription"></span>
                </div>

                <div id="CmItems"></div>
            </div>

            <!-- One film's findings -->
            <div id="CmFilmView" style="display:none;">
                <button is="emby-button" type="button" class="raised emby-button cmBackToItems">
                    <span>&larr; Back</span>
                </button>
                <h2 id="CmFilmName" style="display:inline-block;margin:0 0 0 1em;"></h2>
                <span id="CmFilmProgress" class="fieldDescription" style="margin-left:1em;"></span>

                <div class="cmPlayerWrap">
                    <video id="CmPlayer" controls preload="metadata"></video>
                    <div id="CmPlayerNote" class="fieldDescription"></div>
                </div>

                <div style="margin:1em 0;display:flex;gap:1.2em;flex-wrap:wrap;align-items:center;">
                    <span class="fieldDescription" style="margin:0;">Analyze for:</span>
                    <label class="emby-checkbox-label">
                        <input type="checkbox" is="emby-checkbox" class="cmEngine" value="subtitles" checked />
                        <span>Profanity (subtitles) — fast</span>
                    </label>
                    <label class="emby-checkbox-label">
                        <input type="checkbox" is="emby-checkbox" class="cmEngine" value="whisper" />
                        <span>Profanity (whisper) — slower</span>
                    </label>
                    <label class="emby-checkbox-label">
                        <input type="checkbox" is="emby-checkbox" class="cmEngine" value="vlm" />
                        <span>Visual scenes — hours</span>
                    </label>
                    <button is="emby-button" type="button" id="CmAnalyzeFilm"
                            class="raised button-submit emby-button"><span>Analyze this film</span></button>
                    <span id="CmAnalyzeResult" class="fieldDescription"></span>
                </div>

                <!-- Live progress for any analysis/render pass on this film,
                     one line each. Populated by the poller while work runs. -->
                <div id="CmFilmJobs" class="cmFilmJobs"></div>

                <div style="margin:1em 0;display:flex;gap:.6em;flex-wrap:wrap;align-items:center;">
                    <button is="emby-button" type="button" id="CmNextUndecided"
                            class="raised emby-button" style="display:none;"><span>Next undecided</span></button>
                    <button is="emby-button" type="button" id="CmAdd"
                            class="raised emby-button" style="display:none;"><span>+ Add finding at playhead</span></button>
                    <button is="emby-button" type="button" id="CmOpenReview"
                            class="raised emby-button" style="display:none;"><span>&#8599; Worker review page</span></button>
                </div>

                <!-- Mutes and blurs can't be applied during playback, so acting
                     on them means rendering a separate clean copy from the
                     approved findings. Skips work live and don't need this. -->
                <div style="margin:1em 0;display:flex;gap:.6em;flex-wrap:wrap;align-items:center;">
                    <button is="emby-button" type="button" id="CmRender"
                            class="raised button-submit emby-button"><span>Render clean copy</span></button>
                    <span id="CmRenderNote" class="fieldDescription" style="margin:0;"></span>
                    <span id="CmRenderResult" class="fieldDescription" style="margin:0;"></span>
                </div>

                <div id="CmFindings"></div>
            </div>

            <div id="CmMessage" class="fieldDescription" style="margin-top:1em;"></div>
        </div>
    </div>

<style>
    .cmGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1em;}
    .cmCard{background:#202020;border-radius:6px;overflow:hidden;cursor:pointer;
            border:1px solid transparent;}
    .cmCard:hover{border-color:#00a4dc;}
    .cmCard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#111;}
    .cmCard .cmName{padding:.5em .6em .2em;font-size:13px;}
    .cmCard .cmState{padding:0 .6em .6em;font-size:12px;opacity:.85;}
    .cmPending{color:#e3b341;} .cmDone{color:#3fb950;} .cmNone{opacity:.55;}
    .cmRunning{color:#00a4dc;} .cmFail{color:#f85149;}

    .cmPlayerWrap{margin:1em 0;}
    #CmPlayer{width:100%;max-height:52vh;background:#000;border-radius:6px;}

    .cmRow{background:#202020;border-radius:6px;padding:.8em;margin-bottom:.8em;
           border-left:4px solid #444;}
    .cmRow.cmIsApproved{border-left-color:#3fb950;}
    .cmRow.cmIsRejected{border-left-color:#f85149;opacity:.65;}
    .cmRow.cmCurrent{outline:1px solid #00a4dc;}
    .cmMeta{display:flex;gap:.8em;flex-wrap:wrap;align-items:center;font-size:13px;
            margin-bottom:.6em;}
    .cmTag{background:#333;border-radius:10px;padding:.1em .7em;font-size:12px;}
    .cmTag.cmManual{background:#4b3a6b;}
    .cmReason{font-size:12px;opacity:.75;margin:.3em 0 .6em;}
    .cmTimes{display:flex;gap:.5em;flex-wrap:wrap;align-items:center;font-size:13px;}
    .cmTimes input{width:8.5em;}
    .cmActions{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.7em;}
    .cmWarn{color:#e3b341;font-size:12px;margin-top:.5em;}
    .cmSmall{padding:.3em .8em!important;font-size:12px!important;min-width:0!important;}

    .cmFilmJobs{margin:.6em 0;}
    .cmJobLine{font-size:13px;margin:.35em 0;color:#00a4dc;}
    .cmJobLine.cmQueued{color:#e3b341;}
    .cmBar{height:6px;background:#333;border-radius:3px;overflow:hidden;
           margin-top:.25em;max-width:420px;}
    .cmBarFill{height:100%;background:#00a4dc;transition:width .3s;}
    .cmState .cmJobLine{margin:.2em 0;font-size:12px;}
</style>

<script type="text/javascript">
    (function () {
        var page = document.querySelector('#CleanMediaReviewPage');
        var views = {
            library: page.querySelector('#CmLibraryView'),
            items: page.querySelector('#CmItemsView'),
            film: page.querySelector('#CmFilmView')
        };
        var message = page.querySelector('#CmMessage');
        var player = page.querySelector('#CmPlayer');

        var state = {
            items: [], statuses: {}, film: null, segments: [], poll: null,
            filmStatus: null, workerUrl: '', canPlay: false, playingClip: false
        };

        // -- helpers ---------------------------------------------------------

        function show(name) {
            Object.keys(views).forEach(function (k) {
                views[k].style.display = k === name ? '' : 'none';
            });
            if (name !== 'film') { player.pause(); player.removeAttribute('src'); player.load(); }
            if (name !== 'film') { stopRenderPoll(); stopFilmPoll(); }
            if (name !== 'items') { stopPolling(); }
            message.textContent = '';
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
            });
        }

        function imageUrl(item) {
            if (!item.ImageTags || !item.ImageTags.Primary) { return ''; }
            return ApiClient.getImageUrl(item.Id, {
                type: 'Primary', maxWidth: 300, tag: item.ImageTags.Primary
            });
        }

        // 01:23:45.678 — the format the timing boxes read and write
        function fmt(ms) {
            ms = Math.max(0, Math.round(ms));
            var h = Math.floor(ms / 3600000);
            var m = Math.floor(ms % 3600000 / 60000);
            var s = Math.floor(ms % 60000 / 1000);
            var f = ms % 1000;
            return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m
                + ':' + (s < 10 ? '0' : '') + s + '.' + ('00' + f).slice(-3);
        }

        function parseTime(text) {
            var parts = String(text).trim().split(':');
            if (!parts.length) { return null; }
            var seconds = 0;
            for (var i = 0; i < parts.length; i++) {
                var n = parseFloat(parts[i]);
                if (isNaN(n)) { return null; }
                seconds = seconds * 60 + n;
            }
            return Math.round(seconds * 1000);
        }

        var ENGINE_LABELS = {
            subtitles: 'Profanity (subtitles)',
            whisper: 'Profanity (whisper)',
            vlm: 'Visual scenes',
            render: 'Rendering'
        };
        function engineLabel(e) { return ENGINE_LABELS[e] || e || 'analysis'; }

        function bar(pct) {
            pct = Math.max(0, Math.min(100, Math.round(pct)));
            return '<div class="cmBar"><div class="cmBarFill" style="width:'
                + pct + '%"></div></div>';
        }

        // The active analysis/render passes for one film, as jobs[] (with the
        // one-job `job` as a fallback for an older worker).
        function activeJobs(s) {
            var jobs = (s && s.jobs) || (s && s.job ? [s.job] : []);
            return jobs.filter(function (j) {
                return j.status === 'running' || j.status === 'rendering'
                    || j.status === 'queued';
            });
        }

        // ETA from the rate of progress across polls, smoothed. The worker only
        // reports a fraction, so we estimate the remaining time client-side —
        // which also means it works without waiting for a worker restart. Needs
        // a couple of ticks of movement before it can say anything.
        var etaState = {};  // jobId -> { t, p, rate }
        function etaFor(job) {
            if (!job || (job.status !== 'running' && job.status !== 'rendering')) { return ''; }
            var now = Date.now();
            var p = job.progress || 0;
            var st = etaState[job.id];
            if (st && p > st.p && now > st.t) {
                var inst = (p - st.p) / ((now - st.t) / 1000);  // fraction per second
                st.rate = st.rate ? st.rate * 0.7 + inst * 0.3 : inst;
            }
            if (!st) { st = etaState[job.id] = { rate: 0 }; }
            st.t = now; st.p = p;
            if (!st.rate || p >= 1) { return ''; }
            var secs = (1 - p) / st.rate;
            return isFinite(secs) && secs > 0 ? fmtEta(secs) : '';
        }

        function fmtEta(secs) {
            secs = Math.round(secs);
            if (secs < 60) { return '~' + secs + 's left'; }
            var m = Math.round(secs / 60);
            if (m < 60) { return '~' + m + 'm left'; }
            var h = Math.floor(m / 60);
            m = m % 60;
            return '~' + h + 'h ' + (m ? m + 'm ' : '') + 'left';
        }

        function api(method, path, query, body) {
            var options = {
                type: method,
                url: ApiClient.getUrl('CleanMedia/' + path, query || {}),
                dataType: 'json'
            };
            if (body !== undefined) {
                options.data = JSON.stringify(body);
                options.contentType = 'application/json';
            }
            return ApiClient.ajax(options);
        }

        // -- libraries -------------------------------------------------------

        function loadLibraries() {
            return ApiClient.getJSON(ApiClient.getUrl('Library/MediaFolders')).then(function (res) {
                var libs = (res.Items || []).filter(function (l) {
                    return l.CollectionType === 'movies' || l.CollectionType === 'tvshows'
                        || !l.CollectionType;
                });
                var picker = page.querySelector('#CmLibraryPicker');
                picker.innerHTML = '<div class="cmGrid">' + libs.map(function (l) {
                    return '<div class="cmCard" data-id="' + l.Id + '" data-name="'
                        + escapeHtml(l.Name) + '">'
                        + '<img src="' + imageUrl(l) + '" loading="lazy" />'
                        + '<div class="cmName">' + escapeHtml(l.Name) + '</div></div>';
                }).join('') + '</div>';

                picker.querySelectorAll('.cmCard').forEach(function (card) {
                    card.addEventListener('click', function () {
                        openLibrary(card.getAttribute('data-id'), card.getAttribute('data-name'));
                    });
                });
            });
        }

        // -- one library -----------------------------------------------------

        function openLibrary(parentId, name) {
            show('items');
            page.querySelector('#CmLibraryName').textContent = name;
            page.querySelector('#CmItems').innerHTML =
                '<p class="fieldDescription">Loading&hellip;</p>';

            ApiClient.getJSON(ApiClient.getUrl('Items', {
                ParentId: parentId,
                IncludeItemTypes: 'Movie,Episode',
                Recursive: true,
                Fields: 'Path',
                SortBy: 'SortName',
                Limit: 500
            })).then(function (res) {
                state.items = res.Items || [];
                state.statuses = {};
                if (!state.items.length) {
                    page.querySelector('#CmItems').innerHTML =
                        '<p class="fieldDescription">No videos here.</p>';
                    return;
                }
                renderItems();
                loadStatus();
            });
        }

        function visibleItems() {
            var filter = page.querySelector('#CmFilter').value;
            return state.items.filter(function (item) {
                var s = state.statuses[item.Id];
                if (filter === 'all' || !s) { return filter === 'all'; }
                if (filter === 'pending') { return s.analyzed && s.pending > 0; }
                if (filter === 'unanalyzed') { return !s.analyzed; }
                if (filter === 'done') { return s.analyzed && s.pending === 0; }
                return true;
            });
        }

        function renderItems() {
            var items = visibleItems();
            page.querySelector('#CmItems').innerHTML = items.length
                ? '<div class="cmGrid">' + items.map(function (i) {
                    return '<div class="cmCard" data-id="' + i.Id + '">'
                        + '<img src="' + imageUrl(i) + '" loading="lazy" />'
                        + '<div class="cmName">' + escapeHtml(i.Name) + '</div>'
                        + '<div class="cmState cmNone" id="cmState-' + i.Id + '">'
                        + stateText(state.statuses[i.Id]).text + '</div></div>';
                }).join('') + '</div>'
                : '<p class="fieldDescription">Nothing matches that filter.</p>';

            page.querySelectorAll('#CmItems .cmCard').forEach(function (card) {
                var id = card.getAttribute('data-id');
                card.addEventListener('click', function () { openFilm(id); });
                var s = state.statuses[id];
                if (s) { applyState(page.querySelector('#cmState-' + id), s); }
            });
        }

        function stateText(s) {
            if (!s) { return { cls: 'cmNone', text: 'checking&hellip;' }; }
            var active = activeJobs(s);
            if (active.length) {
                // One line per pass, each with its own percent — so a running
                // visual pass and a queued profanity pass both show, rather
                // than one hiding behind the other.
                var lines = active.map(function (j) {
                    if (j.status === 'queued') {
                        return '<div class="cmJobLine cmQueued">'
                            + escapeHtml(engineLabel(j.engine)) + ' — queued</div>';
                    }
                    var pct = Math.round((j.progress || 0) * 100);
                    var eta = etaFor(j);
                    return '<div class="cmJobLine">' + escapeHtml(engineLabel(j.engine))
                        + ' ' + pct + '%'
                        + (eta ? ' · ' + eta : '')
                        + (j.stage ? ' — ' + escapeHtml(j.stage) : '')
                        + bar(pct) + '</div>';
                });
                return { cls: 'cmRunning', text: lines.join('') };
            }
            if (s.job && s.job.status === 'failed') {
                return { cls: 'cmFail', text: 'analysis failed' };
            }
            if (!s.analyzed) { return { cls: 'cmNone', text: 'not analyzed' }; }
            if (s.pending > 0) {
                return { cls: 'cmPending', text: s.pending + ' of ' + s.total + ' to review' };
            }
            return {
                cls: 'cmDone',
                text: 'reviewed — ' + s.approved + ' approved, ' + s.rejected + ' ignored'
            };
        }

        function applyState(el, s) {
            if (!el) { return; }
            var d = stateText(s);
            el.className = 'cmState ' + d.cls;
            el.innerHTML = d.text;
        }

        function loadStatus() {
            var ids = state.items.map(function (i) { return i.Id; });
            return api('POST', 'Status', {}, { itemIds: ids }).then(function (res) {
                if (res.unreachable) {
                    message.textContent = 'Could not reach the worker. Check the Worker URL '
                        + 'on the Clean Media settings page.';
                    // Leaving the cards on "checking…" reads as "still working";
                    // say plainly that the worker is down instead.
                    state.items.forEach(function (i) {
                        var el = page.querySelector('#cmState-' + i.Id);
                        if (el) { el.className = 'cmState cmFail'; el.innerHTML = 'worker unreachable'; }
                    });
                    return;
                }
                (res.items || []).forEach(function (s) {
                    state.statuses[s.itemId] = s;
                    applyState(page.querySelector('#cmState-' + s.itemId), s);
                });
                schedulePoll();
            }).catch(function (err) {
                message.textContent = 'Could not load review status: ' + err;
            });
        }

        // Only poll while something is actually moving, so an idle dashboard
        // is not calling the worker every few seconds forever.
        function schedulePoll() {
            stopPolling();
            var busy = Object.keys(state.statuses).some(function (id) {
                return activeJobs(state.statuses[id]).length > 0;
            });
            // Only offer "Cancel all" while something is actually queued/running.
            var cancelBtn = page.querySelector('#CmCancelAll');
            if (cancelBtn) { cancelBtn.style.display = busy ? '' : 'none'; }
            if (busy && views.items.style.display !== 'none') {
                state.poll = setTimeout(loadStatus, 5000);
            }
        }

        function stopPolling() {
            if (state.poll) { clearTimeout(state.poll); state.poll = null; }
        }

        // -- one film --------------------------------------------------------

        function openFilm(itemId) {
            var item = state.items.filter(function (i) { return i.Id === itemId; })[0];
            if (!item) { return; }
            stopFilmPoll();
            stopRenderPoll();
            state.film = item;
            state.filmStatus = null;
            state.canPlay = false;
            state.playingClip = false;
            refreshAddButton();
            show('film');
            page.querySelector('#CmFilmName').textContent = item.Name;
            page.querySelector('#CmAnalyzeResult').textContent = '';
            page.querySelector('#CmRenderResult').textContent = '';
            page.querySelector('#CmFilmJobs').innerHTML = '';
            page.querySelector('#CmFindings').innerHTML =
                '<p class="fieldDescription">Loading findings&hellip;</p>';

            // Jellyfin's own stream: same origin, already authenticated, and
            // it gives a real scrub bar over the whole film.
            player.src = ApiClient.getUrl('Videos/' + itemId + '/stream', {
                Static: true, api_key: ApiClient.accessToken()
            });
            page.querySelector('#CmPlayerNote').textContent = '';
            player.onerror = function () {
                page.querySelector('#CmPlayerNote').textContent =
                    'This browser cannot play this file directly (MKV and DVD sources '
                    + 'often need transcoding). Use "Play clip" on a finding instead.';
                if (!state.playingClip) { state.canPlay = false; refreshAddButton(); }
            };
            player.oncanplay = function () {
                if (!state.playingClip) { state.canPlay = true; refreshAddButton(); }
            };

            loadFindings();
            // Show live progress for any pass already running/queued on this
            // film (e.g. a visual pass queued earlier from the grid), without
            // needing to click Analyze.
            pollFilmProgress(itemId, false);
        }

        function stopFilmPoll() {
            if (state.filmPoll) { clearTimeout(state.filmPoll); state.filmPoll = null; }
        }

        function stopRenderPoll() {
            if (state.renderPoll) { clearTimeout(state.renderPoll); state.renderPoll = null; }
        }

        // "Add finding at playhead" only makes sense when the film itself is
        // playing (so the playhead is a real film time). It stays hidden when
        // the browser can't play the file, and while a padded clip is playing —
        // a clip's playhead is relative to the clip, not the film.
        function refreshAddButton() {
            var add = page.querySelector('#CmAdd');
            if (add) { add.style.display = (state.canPlay && !state.playingClip) ? '' : 'none'; }
        }

        // Draw one line per in-flight pass on the open film — each with its own
        // engine label and percent — into the film-view progress area.
        function renderFilmJobs(jobs) {
            var el = page.querySelector('#CmFilmJobs');
            if (!el) { return; }
            var active = activeJobs({ jobs: jobs });
            el.innerHTML = active.map(function (j) {
                if (j.status === 'queued') {
                    return '<div class="cmJobLine cmQueued">'
                        + escapeHtml(engineLabel(j.engine)) + ' — queued</div>';
                }
                var pct = Math.round((j.progress || 0) * 100);
                var eta = etaFor(j);
                return '<div class="cmJobLine">' + escapeHtml(engineLabel(j.engine))
                    + ' ' + pct + '%' + (eta ? ' · ' + eta : '')
                    + (j.stage ? ' — ' + escapeHtml(j.stage) : '')
                    + bar(pct) + '</div>';
            }).join('');
        }

        // Disable analysis choices that are pointless: an engine already
        // running/queued for this film, or one that has already finished. Keeps
        // the reviewer from re-queuing a pass they've already done.
        function updateEngineControls() {
            var s = state.filmStatus || {};
            var inflight = {};
            activeJobs(s).forEach(function (j) { if (j.engine) { inflight[j.engine] = j.status; } });
            var done = {};
            (s.enginesDone || []).forEach(function (e) { done[e] = true; });
            // Also treat an engine that already produced findings as done, so
            // this works even before the worker reports enginesDone.
            (state.segments || []).forEach(function (seg) {
                if (seg.engine && seg.engine !== 'manual') { done[seg.engine] = true; }
            });

            var anyRunnable = false;
            page.querySelectorAll('.cmEngine').forEach(function (cb) {
                var span = cb.parentNode.querySelector('span');
                if (span && !span.getAttribute('data-base')) {
                    span.setAttribute('data-base', span.textContent);
                }
                var base = span ? span.getAttribute('data-base') : '';
                var suffix = '', blocked = false;
                if (inflight[cb.value]) {
                    suffix = inflight[cb.value] === 'queued' ? ' — queued' : ' — running';
                    blocked = true;
                } else if (done[cb.value]) {
                    suffix = ' — done';
                    blocked = true;
                }
                cb.disabled = blocked;
                if (blocked) { cb.checked = false; } else { anyRunnable = true; }
                if (span) { span.textContent = base + suffix; }
                if (cb.parentNode) { cb.parentNode.style.opacity = blocked ? '.55' : ''; }
            });

            var analyzeBtn = page.querySelector('#CmAnalyzeFilm');
            if (analyzeBtn) { analyzeBtn.disabled = !anyRunnable; }
        }

        // Poll the open film's analysis/render progress, showing each pass and
        // loading the findings the moment the last one finishes — no trip back
        // to the grid. `wasActive` means a pass was running last tick, so its
        // disappearance is a completion worth reloading findings for.
        function pollFilmProgress(filmId, wasActive) {
            if (!state.film || state.film.Id !== filmId) { return; }
            api('POST', 'Status', {}, { itemIds: [filmId] }).then(function (res) {
                if (!state.film || state.film.Id !== filmId) { return; }  // navigated away
                var out = page.querySelector('#CmAnalyzeResult');
                if (res.unreachable) {
                    out.textContent = 'Worker unreachable — check the Worker URL.';
                    return;
                }
                var s = (res.items || [])[0] || {};
                state.filmStatus = s;
                var jobs = s.jobs || (s.job ? [s.job] : []);
                var active = activeJobs(s);
                renderFilmJobs(jobs);
                updateEngineControls();
                if (active.length) {
                    out.textContent = '';  // the per-pass lines say it better
                    state.filmPoll = setTimeout(function () {
                        pollFilmProgress(filmId, true);
                    }, 3000);
                    return;
                }
                var failed = jobs.filter(function (j) { return j.status === 'failed'; })[0];
                out.textContent = failed ? 'Analysis failed.' : '';
                if (wasActive) { loadFindings(); }  // a pass just finished
            }).catch(function () {
                state.filmPoll = setTimeout(function () {
                    pollFilmProgress(filmId, wasActive);
                }, 5000);
            });
        }

        function confirmThen(text, onOk) {
            if (window.require) {
                window.require(['confirm'], function (confirm) {
                    confirm({ title: 'Confirm', text: text, confirmText: 'Yes', cancelText: 'Cancel' })
                        .then(onOk, function () { /* cancelled */ });
                });
            } else if (window.confirm(text)) { onOk(); }
        }

        function loadFindings() {
            return api('GET', 'Findings', { itemId: state.film.Id }).then(function (res) {
                if (res.unreachable) {
                    // A down worker returns no segments; without this it would
                    // look identical to a film with nothing flagged.
                    state.segments = [];
                    page.querySelector('#CmFindings').innerHTML =
                        '<p class="fieldDescription">Could not reach the worker &mdash; check the '
                        + 'Worker URL on the Clean Media settings page.</p>';
                    updateProgress();
                    return;
                }
                state.segments = res.segments || [];
                renderFindings();
            }).catch(function (err) {
                page.querySelector('#CmFindings').innerHTML =
                    '<p class="fieldDescription">Could not load findings: '
                    + escapeHtml(err) + '</p>';
            });
        }

        function actionNote(action) {
            // Jellyfin can only skip during playback; mute and blur need the
            // worker to render a clean copy. Saying so beats a silent no-op.
            if (action === 'skip') { return ''; }
            return '<div class="cmWarn">"' + escapeHtml(action) + '" only takes effect in a '
                + 'rendered clean copy — Jellyfin can skip during playback, but cannot '
                + 'mute or blur.</div>';
        }

        function renderFindings() {
            var container = page.querySelector('#CmFindings');
            if (!state.segments.length) {
                container.innerHTML = '<p class="fieldDescription">No findings yet. '
                    + 'Analyze this film, or add one by hand.</p>';
                updateProgress();
                return;
            }

            container.innerHTML = state.segments.map(function (s) {
                var cls = s.approved === true ? ' cmIsApproved'
                    : (s.approved === false ? ' cmIsRejected' : '');
                var actions = ['skip', 'mute', 'blur'].map(function (a) {
                    return '<option value="' + a + '"'
                        + (s.recommendedAction === a ? ' selected' : '') + '>' + a + '</option>';
                }).join('');
                return ''
                + '<div class="cmRow' + cls + '" id="cmRow-' + s.id + '" data-id="' + s.id + '">'
                +   '<div class="cmMeta">'
                +     '<span class="cmTag' + (s.engine === 'manual' ? ' cmManual' : '') + '">'
                +       escapeHtml(s.engine) + '</span>'
                +     '<strong>' + escapeHtml(s.category) + '</strong>'
                +     '<span class="fieldDescription">'
                +       Math.round((s.confidence || 0) * 100) + '% confident</span>'
                +     '<span class="fieldDescription">' + fmt(s.startMs) + ' &rarr; '
                +       fmt(s.endMs) + ' · ' + ((s.endMs - s.startMs) / 1000).toFixed(1) + 's</span>'
                +   '</div>'
                +   (s.reasoning ? '<div class="cmReason">' + escapeHtml(s.reasoning) + '</div>' : '')
                +   '<div class="cmTimes">'
                +     '<button is="emby-button" type="button" class="raised emby-button cmSmall cmPlay">'
                +       '<span>Play here</span></button>'
                +     '<button is="emby-button" type="button" class="raised emby-button cmSmall cmClip">'
                +       '<span>Play clip</span></button>'
                +     '<span>Start</span>'
                +     '<input is="emby-input" type="text" class="cmStart" value="' + fmt(s.startMs) + '" />'
                +     '<button is="emby-button" type="button" class="raised emby-button cmSmall cmSetStart">'
                +       '<span>Set from playhead</span></button>'
                +     '<span>End</span>'
                +     '<input is="emby-input" type="text" class="cmEnd" value="' + fmt(s.endMs) + '" />'
                +     '<button is="emby-button" type="button" class="raised emby-button cmSmall cmSetEnd">'
                +       '<span>Set from playhead</span></button>'
                +   '</div>'
                +   '<div class="cmActions">'
                +     '<button is="emby-button" type="button" class="raised emby-button cmSmall cmApprove">'
                +       '<span>Bad — act on it</span></button>'
                +     '<button is="emby-button" type="button" class="raised emby-button cmSmall cmReject">'
                +       '<span>Fine — ignore</span></button>'
                +     '<select is="emby-select" class="cmAction">' + actions + '</select>'
                +     '<button is="emby-button" type="button" class="raised emby-button cmSmall cmDelete">'
                +       '<span>Delete</span></button>'
                +   '</div>'
                +   actionNote(s.recommendedAction)
                + '</div>';
            }).join('');

            container.querySelectorAll('.cmRow').forEach(bindRow);
            updateProgress();
        }

        function bindRow(row) {
            var id = parseInt(row.getAttribute('data-id'), 10);
            var seg = state.segments.filter(function (s) { return s.id === id; })[0];

            row.querySelector('.cmPlay').addEventListener('click', function () {
                seekTo(seg.startMs);
            });
            row.querySelector('.cmClip').addEventListener('click', function () {
                state.playingClip = true;
                refreshAddButton();
                player.src = ApiClient.getUrl('CleanMedia/Clip', {
                    itemId: state.film.Id, startMs: seg.startMs, endMs: seg.endMs
                });
                player.play().catch(function () { /* user gesture rules vary */ });
                page.querySelector('#CmPlayerNote').textContent =
                    'Playing a transcoded clip with 15s of padding either side.';
            });
            row.querySelector('.cmSetStart').addEventListener('click', function () {
                row.querySelector('.cmStart').value = fmt(player.currentTime * 1000);
                commitTimes(row, seg);
            });
            row.querySelector('.cmSetEnd').addEventListener('click', function () {
                row.querySelector('.cmEnd').value = fmt(player.currentTime * 1000);
                commitTimes(row, seg);
            });
            row.querySelector('.cmStart').addEventListener('change', function () {
                commitTimes(row, seg);
            });
            row.querySelector('.cmEnd').addEventListener('change', function () {
                commitTimes(row, seg);
            });
            row.querySelector('.cmApprove').addEventListener('click', function () {
                patch(seg.id, { approved: true, fields: ['approved'] });
            });
            row.querySelector('.cmReject').addEventListener('click', function () {
                patch(seg.id, { approved: false, fields: ['approved'] });
            });
            row.querySelector('.cmAction').addEventListener('change', function (e) {
                patch(seg.id, {
                    recommendedAction: e.target.value, fields: ['recommendedAction']
                });
            });
            row.querySelector('.cmDelete').addEventListener('click', function () {
                api('DELETE', 'Segments/' + seg.id, { itemId: state.film.Id })
                    .then(afterChange)
                    .catch(failed);
            });
        }

        function commitTimes(row, seg) {
            var start = parseTime(row.querySelector('.cmStart').value);
            var end = parseTime(row.querySelector('.cmEnd').value);
            if (start === null || end === null) {
                message.textContent = 'Timestamps must look like 01:23:45.678.';
                return;
            }
            if (start === seg.startMs && end === seg.endMs) { return; }
            patch(seg.id, { startMs: start, endMs: end, fields: ['startMs', 'endMs'] });
        }

        function patch(segmentId, body) {
            return api('PATCH', 'Segments/' + segmentId, { itemId: state.film.Id }, body)
                .then(afterChange)
                .catch(failed);
        }

        function afterChange(res) {
            if (res && res.segments) {
                state.segments = res.segments;
                renderFindings();
            } else {
                loadFindings();
            }
            // The grid behind this view is now stale.
            delete state.statuses[state.film.Id];
        }

        function failed(err) {
            message.textContent = 'Could not save that change: ' + err;
        }

        function seekTo(ms) {
            try {
                player.currentTime = Math.max(0, ms / 1000);
                player.play().catch(function () { /* autoplay policy */ });
            } catch (e) {
                message.textContent = 'Could not seek — the player may still be loading.';
            }
        }

        function updateProgress() {
            var decided = state.segments.filter(function (s) {
                return s.approved !== null && s.approved !== undefined;
            }).length;
            page.querySelector('#CmFilmProgress').textContent = state.segments.length
                ? decided + ' of ' + state.segments.length + ' decided'
                : '';
            // "Next undecided" only makes sense once there are findings to step
            // through; the worker review page only exists once one is analyzed.
            var hasFindings = state.segments.length > 0;
            page.querySelector('#CmNextUndecided').style.display = hasFindings ? '' : 'none';
            var review = page.querySelector('#CmOpenReview');
            if (review) {
                review.style.display = (hasFindings && state.workerUrl && state.film) ? '' : 'none';
            }
            updateRenderNote();
            updateEngineControls();
        }

        // What a "Render clean copy" would act on, kept in step with the
        // approvals. Only mutes and blurs need a render; skips already work
        // live, so with nothing muted/blurred approved the button is disabled.
        function updateRenderNote() {
            var counts = { mute: 0, blur: 0, skip: 0 };
            state.segments.forEach(function (s) {
                if (s.approved === true && counts[s.recommendedAction] !== undefined) {
                    counts[s.recommendedAction]++;
                }
            });
            var note = page.querySelector('#CmRenderNote');
            var btn = page.querySelector('#CmRender');
            if (!note || !btn) { return; }
            if (!(counts.mute || counts.blur)) {
                btn.disabled = true;
                note.textContent = counts.skip
                    ? 'Approved skips already take effect live — a clean copy is only '
                        + 'needed to mute or blur. Approve a mute or blur to enable it.'
                    : 'Approve a mute or blur finding to render a clean copy.';
                return;
            }
            btn.disabled = false;
            var parts = [];
            if (counts.mute) { parts.push(counts.mute + ' mute' + (counts.mute === 1 ? '' : 's')); }
            if (counts.blur) { parts.push(counts.blur + ' blur' + (counts.blur === 1 ? '' : 's')); }
            if (counts.skip) { parts.push(counts.skip + ' skip' + (counts.skip === 1 ? '' : 's')); }
            note.textContent = 'Writes a new file applying ' + parts.join(', ')
                + '. The original is untouched.';
        }

        page.querySelector('#CmNextUndecided').addEventListener('click', function () {
            var next = state.segments.filter(function (s) {
                return s.approved === null || s.approved === undefined;
            })[0];
            if (!next) {
                message.textContent = 'Every finding in this film has been decided.';
                return;
            }
            var row = page.querySelector('#cmRow-' + next.id);
            page.querySelectorAll('.cmRow').forEach(function (r) {
                r.classList.remove('cmCurrent');
            });
            row.classList.add('cmCurrent');
            row.scrollIntoView({ block: 'center' });
            seekTo(next.startMs);
        });

        page.querySelector('#CmAdd').addEventListener('click', function () {
            var start = Math.round(player.currentTime * 1000);
            api('POST', 'Segments', { itemId: state.film.Id }, {
                startMs: start,
                endMs: start + 3000,
                category: 'manual',
                recommendedAction: 'skip',
                reasoning: 'Added during review'
            }).then(function () {
                loadFindings();
                message.textContent = 'Added a 3s finding at the playhead — adjust its timings below.';
            }).catch(failed);
        });

        page.querySelector('#CmOpenReview').addEventListener('click', function () {
            if (!state.workerUrl || !state.film) { return; }
            // The worker resolves a film by file name, so its own mount path
            // works. Opens the worker's standalone review page in a new tab
            // (a full navigation, so not subject to the browser's CORS rules).
            var path = state.film.Path || state.film.Name;
            window.open(state.workerUrl + '/api/review?path=' + encodeURIComponent(path), '_blank');
        });

        page.querySelector('#CmAnalyzeFilm').addEventListener('click', function () {
            if (!state.film) { return; }
            var film = state.film;
            var engines = Array.prototype.slice
                .call(page.querySelectorAll('.cmEngine'))
                .filter(function (c) { return c.checked; })
                .map(function (c) { return c.value; });
            var out = page.querySelector('#CmAnalyzeResult');
            if (!engines.length) { out.textContent = 'Pick at least one analysis type.'; return; }
            var run = function () {
                out.textContent = 'Queuing…';
                // One job per selected engine — the worker runs them in order.
                Promise.all(engines.map(function (engine) {
                    return api('POST', 'Analyze', {}, { itemIds: [film.Id], engine: engine });
                })).then(function (results) {
                    var queued = 0;
                    results.forEach(function (res) {
                        (res.queued || []).forEach(function (q) { if (q.jobId) { queued++; } });
                    });
                    if (!queued) {
                        out.textContent = 'Could not queue — the worker could not find this file '
                            + 'under its media roots.';
                        return;
                    }
                    stopFilmPoll();
                    pollFilmProgress(film.Id, true);
                }).catch(function (err) { out.textContent = 'Could not queue: ' + err; });
            };
            // The visual pass is GPU-heavy and takes hours; guard that one.
            if (engines.indexOf('vlm') !== -1) {
                confirmThen('Visual analysis of "' + film.Name + '" can take hours and is '
                    + 'GPU-heavy. Start the selected analyses now?', run);
            } else {
                run();
            }
        });

        // -- render a clean copy ---------------------------------------------

        page.querySelector('#CmRender').addEventListener('click', function () {
            if (!state.film) { return; }
            var film = state.film;
            var out = page.querySelector('#CmRenderResult');
            confirmThen(
                'Render a clean copy of "' + film.Name + '"? It writes a new file in a '
                + '"cleaned" folder beside the original, applying every approved mute, blur '
                + 'and skip. A mute-only copy is quick; an approved blur or skip re-encodes '
                + 'the video and takes longer. The original file is never modified.',
                function () {
                    stopRenderPoll();
                    out.textContent = 'Starting render…';
                    api('POST', 'Render', {}, { itemId: film.Id }).then(function (res) {
                        if (!state.film || state.film.Id !== film.Id) { return; }  // navigated away
                        if (res.unreachable) {
                            out.textContent = 'Worker unreachable — check the Worker URL.';
                            return;
                        }
                        if (res.error) { out.textContent = res.error; return; }
                        if (!res.jobId) { out.textContent = 'Could not start the render.'; return; }
                        pollRender(res.jobId, film.Id);
                    }).catch(function (err) {
                        out.textContent = 'Could not start the render: ' + err;
                    });
                });
        });

        // Poll one render job to completion, showing progress and, when done,
        // where the clean copy was written. Bails if the reviewer navigates away.
        function pollRender(jobId, filmId) {
            var out = page.querySelector('#CmRenderResult');
            api('GET', 'RenderStatus', { jobId: jobId }).then(function (res) {
                if (!state.film || state.film.Id !== filmId) { return; }
                if (res.unreachable) {
                    out.textContent = 'Worker unreachable during render — check the Worker URL.';
                    return;
                }
                if (res.status === 'rendered') {
                    out.textContent = 'Clean copy written'
                        + (res.renderedPath ? ' → ' + res.renderedPath : '') + '.';
                    return;
                }
                if (res.status === 'failed') {
                    var why = res.error ? String(res.error).split('\n')[0] : '';
                    out.textContent = 'Render failed' + (why ? ': ' + why : '') + '.';
                    return;
                }
                if (res.status === 'cancelled') { out.textContent = 'Render cancelled.'; return; }
                var pct = Math.round((res.progress || 0) * 100);
                out.textContent = 'Rendering ' + pct + '%'
                    + (res.stage ? ' — ' + res.stage : '');
                state.renderPoll = setTimeout(function () { pollRender(jobId, filmId); }, 2000);
            }).catch(function () {
                state.renderPoll = setTimeout(function () { pollRender(jobId, filmId); }, 4000);
            });
        }

        // -- queueing --------------------------------------------------------

        function doQueue(items, engine) {
            var out = page.querySelector('#CmQueueResult');
            out.textContent = 'Queueing ' + items.length + '…';

            api('POST', 'Analyze', {}, {
                itemIds: items.map(function (i) { return i.Id; }),
                engine: engine
            }).then(function (res) {
                var queued = (res.queued || []).filter(function (q) { return q.jobId; });
                out.textContent = 'Queued ' + queued.length + ' of ' + items.length + '.';
                loadStatus();
            }).catch(function (err) {
                out.textContent = 'Could not queue: ' + err;
            });
        }

        page.querySelector('#CmQueueVisible').addEventListener('click', function () {
            var items = visibleItems();
            if (!items.length) { return; }
            var engine = page.querySelector('#CmEngine').value;
            var engineSel = page.querySelector('#CmEngine');
            var engineLabel = engineSel.options[engineSel.selectedIndex].text;
            // Guard the batch: one click here can queue a whole library for
            // hours of analysis, so confirm the count and engine first.
            var text = 'Queue ' + items.length + ' video' + (items.length === 1 ? '' : 's')
                + ' for analysis (' + engineLabel + ')? Analysis runs on the worker and can '
                + 'take a while and use significant CPU/GPU.';
            if (window.require) {
                window.require(['confirm'], function (confirm) {
                    confirm({
                        title: 'Queue analysis',
                        text: text,
                        confirmText: 'Queue ' + items.length,
                        cancelText: 'Cancel'
                    }).then(function () { doQueue(items, engine); }, function () { /* cancelled */ });
                });
            } else if (window.confirm(text)) {
                doQueue(items, engine);
            }
        });

        page.querySelector('#CmCancelAll').addEventListener('click', function () {
            var out = page.querySelector('#CmQueueResult');
            var run = function () {
                out.textContent = 'Cancelling…';
                api('POST', 'Jobs/CancelAll', {}).then(function (res) {
                    if (res.unreachable) {
                        out.textContent = 'Could not reach the worker.';
                        return;
                    }
                    out.textContent = 'Cancelled ' + (res.cancelled || 0) + ' job(s).';
                    loadStatus();
                }).catch(function (err) { out.textContent = 'Could not cancel: ' + err; });
            };
            var text = 'Cancel all queued and running analysis jobs?';
            if (window.require) {
                window.require(['confirm'], function (confirm) {
                    confirm({
                        title: 'Cancel analysis',
                        text: text,
                        confirmText: 'Cancel all',
                        cancelText: 'Keep running'
                    }).then(run, function () { /* kept running */ });
                });
            } else if (window.confirm(text)) {
                run();
            }
        });

        page.querySelector('#CmFilter').addEventListener('change', renderItems);

        page.querySelector('#CmOpenSettings').addEventListener('click', function () {
            // The config page is registered under the plugin name. Navigate to
            // it directly: in Jellyfin 10.11 the plugin's own "Settings" button
            // always opens this main-menu page instead (findBestConfigurationPage
            // prefers the EnableInMainMenu page), so this is the way to reach it.
            Dashboard.navigate('configurationpage?name=Clean Media');
        });

        page.querySelectorAll('.cmBack').forEach(function (b) {
            b.addEventListener('click', function () { show('library'); });
        });
        page.querySelectorAll('.cmBackToItems').forEach(function (b) {
            b.addEventListener('click', function () {
                stopFilmPoll();
                show('items');
                // Counts changed while reviewing; refresh rather than lie.
                loadStatus();
            });
        });

        function refresh() {
            show('library');
            // The worker URL powers the "Worker review page" link; if it can't
            // be read the button simply stays hidden.
            api('GET', 'Config').then(function (res) {
                state.workerUrl = (res && res.workerUrl) || '';
            }).catch(function () { state.workerUrl = ''; });
            loadLibraries().then(function () { Dashboard.hideLoadingMsg(); });
        }

        // pageshow for return visits, immediate for the first render, where
        // the event has usually already fired by the time this runs.
        page.addEventListener('pageshow', refresh);
        page.addEventListener('pagehide', stopPolling);
        refresh();
    })();
</script>
</div>
</body>
</html>
